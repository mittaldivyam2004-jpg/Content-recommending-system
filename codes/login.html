<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Music Recommender</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* small page-specific layout */
    body{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(180deg,#071026,#081428);margin:0;color:#e6eef8;font-family:Inter,system-ui,Segoe UI,Roboto}
    .card{width:420px;background:rgba(15,23,36,0.7);padding:32px;border-radius:12px;box-shadow:0 20px 40px rgba(2,6,23,0.6);text-align:center}
    .logo{font-size:48px;margin-bottom:8px}
    h1{margin:4px 0 12px}
    .btn-google{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border-radius:28px;background:#fff;color:#111;border:none;cursor:pointer;font-weight:600}
    .small{color:var(--muted);font-size:13px;margin-top:12px}
    a.link{color:#7c5cff;text-decoration:none;margin-top:10px;display:inline-block}
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="logo">🎵</div>
    <h1>Welcome back</h1>
    <p class="small">Sign in to get personalized recommendations</p>

    <div style="height:18px"></div>

    <button id="btn-google" class="btn-google" aria-label="Sign in with Google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="20" height="20">
      Continue with Google
    </button>

    <div class="small">or</div>
    <a class="link" href="index.html">Use app without signing in</a>
  </div>

  <!-- Firebase v8 (namespaced) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js" defer></script>

  <script src="firebase-config.js" defer></script>
  <script src="login.js" defer></script>
</body>
</html>
